<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join TriviaGameAi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M20 14h24a5 5 0 0 1 5 5v26a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5V19a5 5 0 0 1 5-5z' fill='none' stroke='%233b82f6' stroke-width='4'/%3E%3Cpath d='M24 24h16M24 32h16M24 40h9' stroke='%237dd3fc' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b1220;
    --accent: #3b82f6;
    --text: #e6edf7;
    --muted: #8fa0b8;
    --glass: rgba(255, 255, 255, 0.055);
    --glass-border: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(59, 130, 246, 0.14), transparent 60%),
      var(--bg);
    color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 28px 16px;
  }
  .card {
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 30px 28px; max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; }
  .brand svg { width: 34px; height: 34px; color: var(--accent); flex-shrink: 0; }
  .brand h1 { font-size: 20px; font-weight: 650; letter-spacing: 0.2px; }
  .qr-box { width: min(300px, 78vw); aspect-ratio: 1; margin: 0 auto 18px; border-radius: 16px; background: #fff; padding: 10px; display: grid; place-items: center; }
  .qr-box img { width: 100%; height: 100%; image-rendering: pixelated; border-radius: 8px; }
  .join-url { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14.5px; color: var(--accent); background: rgba(59,130,246,.1); padding: 10px 12px; border-radius: 10px; display: inline-block; margin-bottom: 12px; word-break: break-all; }
  p { font-size: 14px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9.5 7h5M9.5 11h5M9.5 15h3"/></svg>
    <div><h1>Join TriviaGameAi</h1></div>
  </div>
  <div class="qr-box"><img id="qrImg" src="/qr.png" alt="Join QR code"></div>
  <div class="join-url" id="joinUrl">…</div>
  <p>Scan with your phone camera (or open the link), enter a team name, and you're in!</p>
</div>
<script>
fetch('/join-info').then(r => r.json()).then(d => {
  if (d.joinUrl) document.getElementById('joinUrl').textContent = d.joinUrl;
}).catch(() => {});
</script>
</body>
</html>
